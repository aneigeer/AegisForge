name: ci

on:
  push:
  pull_request:

jobs:
  unit-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q apps core database scripts

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Compose config validation
        run: docker compose config > /dev/null

      - name: Secret scan
        run: |
          set -e
          PATTERNS='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|DG_(RO|RW|PG_RO|PG_RW|ADMIN)_DSN=[a-z]+://[^:\s]+:(?!CHANGE_ME)[^@\s]+@'
          if grep -RInE "$PATTERNS" \
            --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.md' --include='*.ps1' --include='*.sql' \
            --include='*.txt' --include='*.example' \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=项目规划 --exclude-dir=runs \
            --exclude-dir=__pycache__ --exclude=ci_check.ps1 .; then
            echo "Secret scan failed" >&2
            exit 1
          fi
          echo "Secret scan passed"

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: rootpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DG_ADMIN_DSN: mysql://root:rootpw@127.0.0.1:3306/mysql?charset=utf8mb4
      DG_RO_PASSWORD: ro_pw
      DG_RW_PASSWORD: rw_pw
      DG_CONTROL_PASSWORD: ctl_pw
      DG_RO_DSN: mysql://dg_ro:ro_pw@127.0.0.1:3306/dg_lab?charset=utf8mb4
      DG_RW_DSN: mysql://dg_rw:rw_pw@127.0.0.1:3306/dg_lab?charset=utf8mb4
      DG_CONTROL_DSN: mysql://dg_ctl:ctl_pw@127.0.0.1:3306/dg_system?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bootstrap MySQL and migrations
        run: python scripts/bootstrap_mysql.py
      - name: Integration tests (PostgreSQL tests skip when no DSN)
        run: python -m pytest tests/integration -q

name: 功能建议
description: 提出新能力、集成或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明真实使用场景与约束，避免只描述实现方式。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你正在解决什么问题？涉及哪类数据库/后端栈/合规要求？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为、接口或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 检测与风险定级
        - 脱敏与模型网关
        - 沙箱验证与执行保护
        - 审批、审计与合规
        - 桌面端交互
        - 多 Agent / 后端代码审计
        - 部署与可观测性
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与路线图，未发现重复
          required: true

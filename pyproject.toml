[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbguardian"
version = "0.1.0"
description = "AegisForge - 零信任 AI 护栏工程与多 Agent 安全运维平台（技术预览）"
readme = "README.md"
license = { text = "Apache-2.0" }
# 兼容下限取 3.12：本仓库已在 CPython 3.12 与 3.14 上跑通全量单测（见 CI matrix）。
# 之所以不写死单一小版本：库形态的可复用组件需要能被其他 Python 项目直接安装。
requires-python = ">=3.12"
dependencies = [
    # 只约束"必需的下限"与"已知会破坏 API 的上限"，不锁小版本，便于与宿主项目共存。
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "PyMySQL>=1.0",
    "psycopg[binary]>=3.1",
    "jsonschema>=4.17",
    "cryptography>=41.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.24",
]

[project.scripts]
dbguardian-desktop = "apps.desktop.launcher:main"
aegisforge-gate = "apps.cli.secops_gate:main"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "database*", "adapters*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: 需要真实 MySQL 8 实例的集成测试",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dbguardian"
version = "0.1.0"
description = "DBGuardian - MySQL 8 专业数据库诊断、故障恢复与持续进化 Agent（Alpha）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "PyMySQL>=1.1,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "jsonschema>=4.23,<5.0",
    "cryptography>=42.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
dbguardian-desktop = "apps.desktop.launcher:main"
aegisforge-gate = "apps.cli.secops_gate:main"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "database*", "adapters*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: 需要真实 MySQL 8 实例的集成测试",
]
